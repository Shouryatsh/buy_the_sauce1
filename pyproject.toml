[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "wheelcli"
version = "0.1.0"
description = "Modular CLI tool for scanning wheel-strategy CSP candidates via IBKR"
requires-python = ">=3.11"
readme = "wheelcli/README.md"

dependencies = [
    "typer[all]>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pydantic-settings>=2",
    "ib-insync>=0.9.86",
    "diskcache>=5",
    "pandas>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
wheel = "wheelcli.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["wheelcli*"]

[tool.pytest.ini_options]
testpaths = ["wheelcli/tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["wheelcli"]
omit = ["wheelcli/tests/*"]
